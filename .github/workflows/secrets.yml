name: Set Up Project Configuration

on:
  push:
    branches: [ "mqin" ]  # Runs automatically when you push code to main

jobs:
  configure-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This is the action snippet from your screen
      - name: Set Repo Secrets and Variables
        uses: howlowck/set-secrets-action@1.4.0
        with:
          security-token: ${{ secrets.MY_CUSTOM_PAT_TOKEN }}
          repo-owner: "YOUR_GITHUB_USERNAME"
          repo-name: "YOUR_REPOSITORY_NAME"
          secrets-from-env: |
            TARGET_SECRET_NAME=ENV_VAR_NAME
          vars-from-env: |
            TARGET_VAR_NAME=ENV_VAR_NAME
